name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "feed.xml"
      - "scripts/submit-indexnow.mjs"
      - "f94f86596256e1597287ad38cee3f9cf.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for GitHub Pages to publish this revision
        run: |
          changed_file="$(git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" -- "*.html" "sitemap.xml" | head -n 1)"
          if [ -z "$changed_file" ]; then
            changed_file="sitemap.xml"
          fi

          if [ "$changed_file" = "index.html" ]; then
            live_url="https://carsalestrackerpro.com/"
          elif [[ "$changed_file" = */index.html ]]; then
            live_url="https://carsalestrackerpro.com/${changed_file%index.html}"
          else
            live_url="https://carsalestrackerpro.com/${changed_file}"
          fi

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${live_url}?revision=${GITHUB_SHA}" --output /tmp/live-revision &&
               cmp --silent "$changed_file" /tmp/live-revision; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not publish ${changed_file} after five minutes."
          exit 1

      - name: Submit canonical URLs
        run: node scripts/submit-indexnow.mjs
